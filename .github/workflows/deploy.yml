name: Deploy Frontend App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          script: |
            set -euo pipefail
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            cd /home/esawda-demo/htdocs/demo.esawda.com
            echo "==> before pull:"; git log --oneline -1
            git fetch origin main
            git reset --hard origin/main
            echo "==> after pull:"; git log --oneline -1
            npm ci
            rm -rf .next
            npm run build
            pm2 restart esawda-frontend --update-env
            pm2 save
            echo "==> deploy complete on $(git rev-parse --short HEAD)"