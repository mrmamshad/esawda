name: Deploy Frontend App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      # NOTE: `npm run lint` (next lint) is interactive in Next 15 and has no
      # config in this repo yet — enable this step once flat ESLint config
      # lands, otherwise CI would hang on the setup prompt.

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          script: |
            set -eo pipefail
            echo "==> whoami: $(whoami)  pwd: $(pwd)"
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then . "$NVM_DIR/nvm.sh"; fi
            echo "==> node: $(node -v 2>/dev/null || echo MISSING)"
            echo "==> npm:  $(npm -v 2>/dev/null || echo MISSING)"
            echo "==> pm2:  $(pm2 -v 2>/dev/null || echo MISSING)"
            cd /home/esawda-demo/htdocs/demo.esawda.com
            echo "==> before pull:"; git log --oneline -1
            export GIT_SSH_COMMAND="ssh -i /home/esawda-demo/.ssh/github_actions_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
            git fetch origin main
            git reset --hard origin/main
            echo "==> after pull:"; git log --oneline -1
            npm ci
            # No `rm -rf .next` — Next invalidates changed chunks itself and a
            # cold rebuild turns every deploy into ISR downtime; `pm2 reload`
            # below swaps workers with zero dropped connections.
            npm run build
            pm2 reload esawda-frontend --update-env || pm2 start npm --name esawda-frontend -- start
            pm2 save
            # Reload swaps workers gracefully but the fresh Next server needs
            # seconds to boot — single-shot curl flaps 502 here, so poll.
            for i in $(seq 1 18); do
              sleep 5
              if curl -sf -o /dev/null https://esawda.com/; then
                echo "==> health OK after ${i}x5s"
                break
              fi
              if [ "$i" = 18 ]; then echo "==> health check FAILED"; exit 1; fi
            done
            echo "==> deploy complete on $(git rev-parse --short HEAD)"